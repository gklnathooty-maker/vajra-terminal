<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DD9D"/>
      <stop offset="50%" stop-color="#D7B15A"/>
      <stop offset="100%" stop-color="#9C7726"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151E1A"/>
      <stop offset="100%" stop-color="#080C0A"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DCEA0"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield / Tile -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Candlesticks & Technical Bars -->
  <!-- Left Bar -->
  <line x1="12" y1="21" x2="12" y2="35" stroke="#D7B15A" stroke-width="1.2"/>
  <rect x="10" y="24" width="4" height="7" rx="1" fill="#D7B15A"/>

  <!-- Middle Bar -->
  <line x1="20" y1="15" x2="20" y2="37" stroke="#A3B8AC" stroke-width="1.2"/>
  <rect x="18" y="19" width="4" height="11" rx="1" fill="#E7EEE8"/>

  <!-- Right Bullish Breakout Bar -->
  <line x1="28" y1="9" x2="28" y2="33" stroke="#7DCEA0" stroke-width="1.2"/>
  <rect x="26" y="12" width="4" height="14" rx="1" fill="url(#neonGreen)"/>

  <!-- Dynamic Trendline Vector passing through -->
  <path d="M 8 33 L 18 24 L 28 15 L 38 7" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Upward Breakout Head -->
  <circle cx="38" cy="7" r="2.5" fill="#7DCEA0" stroke="#080C0A" stroke-width="0.8"/>
</svg>
