apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stock-intelligence-live
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/sessionAffinity: "true"
    spec:
      timeoutSeconds: 3600
      containerConcurrency: 100
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/stock-intelligence/live:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
