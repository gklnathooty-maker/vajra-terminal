name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Tests
        env:
          PYTHONPATH: backend
        run: pytest -q tests

      - name: Compile
        env:
          PYTHONPATH: backend
        run: python -m compileall backend/app
